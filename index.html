<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="./css/style.css">
	<script type="module" src="./dist/main.js"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Javelin Idle</title>
</head>

<body>
	<div class="header">
		<div id="header-title">Javelin Idle</div>
		<div id="manage-game-save">
			<div id="save-game">
				<button id="save-game-button">Save game</button>
				<button id="copy-game-save">Copy game save string</button>
			</div>
			<div id="load-game">
				<input type="text" id="load-game-input" placeholder="Load game from string instead">
				<button id="load-game-button">Load</button>
			</div>
		</div>
	</div>
	<div class="center">
		<div class="stat-displays">
			<div class="multi-display unavailable">
				<div class="multi-title">Character Multiplier:</div>
				<div class="multi-value"></div>
			</div>
			<div class="score-display">
				<div class="score-title">Characters Typed:</div>
				<div class="score-value"></div>
			</div>
		</div>
		<div class="interaction-zones">
			<div class="zone-left">
				<div class="auto-inputs">
				</div>
			</div>
			<div class="zone-center">
				<input type="text" name="typing-input" class="typing-input">
				<div class="goal-display">
					<div class="goal-title">Type: </div>
					<div class="goal-value"></div>
				</div>
			</div>
			<div class="zone-right">
				<div class="game-settings unavailable">
					<div class="game-settings-title">Game Settings</div>
					<div class="char-set-toggles">
					</div>
					<div class="spacing-toggles">
					</div>
				</div>
			</div>
		</div>
		<div class="upgrades">
		</div>
	</div>
	<div class="footer">By Payson Eberz</div>
</body>

</html>
